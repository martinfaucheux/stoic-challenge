version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-email_security}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    # TODO: For production, remove --reload command and source code volume mount below
    build: .
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/email_security}
      GMAIL_CREDENTIALS_FILE: ${GMAIL_CREDENTIALS_FILE:-/app/gmail/credentials.json}
      GMAIL_TOKEN_FILE: ${GMAIL_TOKEN_FILE:-/app/gmail/token.json}
      MAX_EMAILS_TO_FETCH: ${MAX_EMAILS_TO_FETCH:-10}
    volumes:
      - .:/app # TODO: For production, remove this full directory mount
      - ./gmail:/app/gmail
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
